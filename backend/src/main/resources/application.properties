spring.application.name=docubot-pro

# ─── Database (pgvector Docker) ─────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/docubot
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ────────────────────────────────────────────────
jwt.secret=docubot-pro-secret-key-must-be-256-bits-long-at-minimum
jwt.expiration=86400000

# ─── File Upload ────────────────────────────────────────
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Spring AI Groq (Chat) ───────────────────────────────
spring.ai.openai.api-key=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
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# ─── Jina AI (Embeddings) ───────────────────────────────
spring.ai.openai.embedding.api-key=jina_c06a428e9c72485e908d06116eb49ac0cKpmqqV_ZpJwxIQ4Dd4JAqjjj_vp
spring.ai.openai.embedding.base-url=https://api.jina.ai
spring.ai.openai.embedding.options.model=jina-embeddings-v2-base-en

# ─── pgvector ───────────────────────────────────────────
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# ─── Enable models ──────────────────────────────────────
spring.ai.model.chat=openai
spring.ai.model.embedding=openai