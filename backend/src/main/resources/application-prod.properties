spring.application.name=docubot-pro

# ─── Database (Render PostgreSQL) ───────────────────────
spring.datasource.url=jdbc:postgresql://dpg-d8i5e7r7uimc73adekb0-a.singapore-postgres.render.com:5432/docubot_db_iqx6
spring.datasource.username=docubot_db_iqx6_user
spring.datasource.password=5hcLXYuC9me3FasuIFDXESBMCkhwrXnt
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ────────────────────────────────────────────────
jwt.secret=docubot-pro-secret-key-must-be-256-bits-long-at-minimum
jwt.expiration=86400000

# ─── File Upload ────────────────────────────────────────
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Spring AI Groq (Chat) ───────────────────────────────
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# ─── Jina AI (Embeddings) ───────────────────────────────
spring.ai.openai.embedding.api-key=${JINA_API_KEY}
spring.ai.openai.embedding.base-url=https://api.jina.ai
spring.ai.openai.embedding.options.model=jina-embeddings-v2-base-en

# ─── pgvector ───────────────────────────────────────────
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# ─── Enable models ──────────────────────────────────────
spring.ai.model.chat=openai
spring.ai.model.embedding=openai